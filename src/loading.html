<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dsh-skin</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e8eaed;
    }
    .wrap {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
      font-weight: 600;
    }
    #error {
      margin: 0 0 1.25rem;
      color: #f0a8a8;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    #error:empty {
      display: none;
    }
    #retry {
      display: none;
      appearance: none;
      border: 1px solid #5a6270;
      background: #1c212b;
      color: #e8eaed;
      padding: 0.55rem 1.1rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #retry:hover {
      background: #252b38;
    }
    #retry.visible {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">正在启动 dsh…</h1>
    <p id="error"></p>
    <button id="retry" type="button">重试</button>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const error = params.get('error');
      const title = document.getElementById('title');
      const errorEl = document.getElementById('error');
      const retryBtn = document.getElementById('retry');

      if (error) {
        title.textContent = '启动失败';
        errorEl.textContent = error;
        retryBtn.classList.add('visible');
      }

      retryBtn.addEventListener('click', function () {
        if (window.dshSkin && typeof window.dshSkin.retry === 'function') {
          window.dshSkin.retry();
        }
      });
    })();
  </script>
</body>
</html>
